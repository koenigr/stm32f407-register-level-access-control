name: renode
on: [push, pull_request]

jobs:
  renode:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make cmake

      - name: Run Renode tests
        uses: antmicro/renode-test-action@v5
        with:
          renode-revision: 'v1.17.0'
          tests-to-run: 'Tests/renode/access.robot'