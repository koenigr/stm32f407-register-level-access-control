name: renode
on: [push, pull_request]
jobs:
  renode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi make cmake
      - run: make firmware   # replace with your real firmware build; must produce build-firmware/stm32f407_access_control
      - uses: antmicro/renode-test-action@v4
        with:
          renode-version: '1.17.0'
          tests-to-run: 'Tests/renode/access.robot'