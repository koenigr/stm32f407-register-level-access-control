name: STM32 CI

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-build:
    name: Build STM32 Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Install ARM toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc-arm-none-eabi \
          libnewlib-arm-none-eabi \
          libstdc++-arm-none-eabi-newlib

    - name: Verify ARM toolchain
      run: arm-none-eabi-gcc --version

    - name: Configure CMake
      run: |
        cmake \
          -S . -B build-firmware \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-gcc-toolchain.cmake

    - name: Build firmware
      run: cmake --build build-firmware --parallel

  unit-tests:
    name: Build and Run Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: verify build tools
        run: cmake --version && gcc --version

      - name: Configure tests
        run: cmake -S . -B build-tests -DBUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build-tests --parallel

      - name: Run unit-tests
        run: ctest --test-dir build-tests --output-on-failure
