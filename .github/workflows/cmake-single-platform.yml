name: STM32 CI

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  firmware-build:
    name: Build STM32 Firmware
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install ARM toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi

    - name: Verify ARM toolchain
      run: |
        arm-none-eabi-gcc --version

    - name: Configure CMake
      run: |
        cmake \
          -S . -B build-firmware \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-gcc-toolchain.cmake

    - name: Build firmware
      run: cmake --build build-firmware --parallel

  unit-tests:
    name: Build and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure tests
        run: cmake -S . -B build-tests -DBUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build-tests --parallel

      - name: Run unit-tests
        run: ./build-tests/Tests/unit_tests
